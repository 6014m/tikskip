name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -60 > errors.txt || true
          cat errors.txt
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(printf 'Build failed:\n```\n%s\n```' "$(cat errors.txt)")"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TikSkip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TikSkip-apk
          path: TikSkip.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TikSkip (latest build)
          body: Download TikSkip.apk below and install it on your phone.
          files: TikSkip.apk
          prerelease: false
